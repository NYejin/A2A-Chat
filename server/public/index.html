<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A2A Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root {
  --page: #e9ecf1; --paper: #ffffff; --fg: #17181a; --muted: #7b8089; --line: #eceef2; --chip: #f2f4f7;
  --blue: #2f6fed; --ok: #1f8a4c; --no: #d14343; --warn: #c27c0e; --mention: #f2b632;
  --banner: #121316; --banner-fg: #ffffff; --code-bg: rgba(0,0,0,.05);
  --tint-l: 95%; --tint-s: 75%; --line-l: 86%; --line-s: 45%;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0d0e10; --paper: #17191c; --fg: #ebecef; --muted: #8d929b; --line: #262930; --chip: #22252a;
    --banner: #000; --banner-fg: #fff; --code-bg: rgba(255,255,255,.07);
    --tint-l: 19%; --tint-s: 28%; --line-l: 27%; --line-s: 25%;
  }
}
:root[data-theme="dark"] {
  --page: #0d0e10; --paper: #17191c; --fg: #ebecef; --muted: #8d929b; --line: #262930; --chip: #22252a;
  --banner: #000; --banner-fg: #fff; --code-bg: rgba(255,255,255,.07);
  --tint-l: 19%; --tint-s: 28%; --line-l: 27%; --line-s: 25%;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--page); color: var(--fg); font: 14px/1.55 "Noto Sans KR", system-ui, sans-serif; overflow: hidden; }
button { font: inherit; cursor: pointer; color: inherit; }
code, pre { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12.5px; }

/* 한 줄 기둥: 메신저 화면 하나 */
.phone { height: 100vh; height: 100dvh; max-width: 680px; margin: 0 auto; background: var(--paper); display: flex; flex-direction: column; box-shadow: 0 0 0 1px var(--line), 0 10px 40px rgba(0,0,0,.06); }

/* 상단: 제목 / 사람들 / 채널 */
.top { padding: 18px 20px 0; border-bottom: 1px solid var(--line); flex: none; }
.title-row { display: flex; align-items: flex-start; gap: 10px; }
.title-row .t { flex: 1; min-width: 0; }
h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
.sub { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.live { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #aaa; margin-right: 5px; vertical-align: 1px; }
.live.on { background: #22b573; box-shadow: 0 0 0 3px rgba(34,181,115,.18); }
.tbtn { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 5px 12px; font-size: 13px; white-space: nowrap; }
.tbtn b { color: var(--warn); }
.tbtn.round { padding: 5px 9px; }

.people { display: flex; gap: 14px; overflow-x: auto; padding: 14px 0 10px; scrollbar-width: none; }
.people::-webkit-scrollbar { display: none; }
.person { display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: 0; padding: 0; width: 58px; flex: none; opacity: .55; }
.person.on { opacity: 1; }
.person .pa { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; position: relative; font-size: 15px; }
.person.human .pa { border-radius: 12px; background: var(--banner) !important; }
.person .pa i { position: absolute; right: -1px; bottom: -1px; width: 12px; height: 12px; border-radius: 50%; background: #b8bcc3; border: 2px solid var(--paper); }
.person.on .pa i { background: #22b573; }
.person .pn { font-size: 11px; max-width: 58px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.person .pr { font-size: 10px; color: var(--muted); max-width: 58px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: -3px; }
.person.focus .pa { box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--blue); }

.chans { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 12px; scrollbar-width: none; }
.chans::-webkit-scrollbar { display: none; }
.chan { border: 0; background: var(--chip); color: var(--muted); border-radius: 999px; padding: 4px 12px; font-size: 13px; white-space: nowrap; flex: none; }
.chan.on { background: var(--fg); color: var(--paper); font-weight: 500; }
.chan .n { background: var(--no); color: #fff; border-radius: 9px; font-size: 10px; padding: 0 5px; margin-left: 4px; font-weight: 700; }
.focusbar { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--blue); padding: 0 0 10px; }
.focusbar button { border: 0; background: var(--chip); border-radius: 999px; padding: 1px 8px; font-size: 12px; }

/* 대화 피드 */
.feed { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 6px 20px 24px; }
.empty { color: var(--muted); text-align: center; margin-top: 18vh; line-height: 1.8; }
.empty code { background: var(--chip); padding: 2px 8px; border-radius: 6px; }
.div { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 11.5px; margin: 20px 0 6px; }
.div::before, .div::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.m { margin-top: 12px; position: relative; }
.m.cont { margin-top: 3px; }
.m.cont .lbl { display: none; }
.lbl { font-size: 11.5px; color: var(--muted); margin: 0 0 3px 2px; }
.lbl b { color: var(--fg); font-weight: 700; }
.lbl .to { color: var(--fg); }
.lbl .ch { color: var(--blue); }
.bub { display: inline-block; vertical-align: top; background: hsl(var(--h) var(--tint-s) var(--tint-l)); border: 1px solid hsl(var(--h) var(--line-s) var(--line-l)); border-radius: 4px 16px 16px 16px; padding: 7px 12px; max-width: min(470px, 86%); word-break: break-word; }
.m.mine { text-align: right; }
.m.mine .lbl { margin: 0 2px 3px 0; }
.m.mine .bub { background: var(--blue); border-color: var(--blue); color: #fff; border-radius: 16px 4px 16px 16px; text-align: left; }
.m.mine .bub .at { color: #fff; background: rgba(255,255,255,.22); }
.m.mine .bub code, .m.mine .bub pre { background: rgba(0,0,0,.2); color: #fff; }
.m.mine .bub a { color: #fff; }
.m.mine .quote { color: rgba(255,255,255,.8); border-color: rgba(255,255,255,.5); }
.m.mention .bub { box-shadow: 0 0 0 2px var(--mention); }
.m.dim, .banner.dim, .sys.dim { opacity: .35; }

.txt p { margin: 0; }
.txt pre { background: var(--code-bg); border-radius: 8px; padding: 8px 10px; overflow-x: auto; margin: 4px 0; white-space: pre-wrap; }
.txt code { background: var(--code-bg); border-radius: 4px; padding: 1px 4px; }
.txt pre code { background: none; padding: 0; }
.at { color: var(--blue); background: rgba(47,111,237,.1); border-radius: 4px; padding: 0 2px; font-weight: 500; }
.quote { border-left: 2px solid currentColor; opacity: .75; padding-left: 7px; font-size: 12px; margin-bottom: 3px; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vote { font-size: 13px; }

/* 사람 개입: 검은 배너 */
.banner { background: var(--banner); color: var(--banner-fg); border-radius: 12px; padding: 9px 14px; margin: 14px 0; position: relative; }
.banner .who { font-weight: 700; }
.banner .meta { font-size: 11px; opacity: .55; margin-left: 6px; }
.banner .at { color: #ffd76a; background: rgba(255,215,106,.15); }
.banner .quote { color: #bbb; }
.banner.me { box-shadow: 0 0 0 2px var(--blue); }

/* 시스템 */
.sys { text-align: center; margin: 12px 0; }
.sys span { display: inline-block; font-size: 12px; border-radius: 999px; padding: 3px 12px; background: var(--chip); color: var(--muted); }
.sys.ok span { background: rgba(31,138,76,.12); color: var(--ok); font-weight: 500; }
.sys.no span { background: rgba(209,67,67,.1); color: var(--no); font-weight: 500; }

/* 결정 카드 */
.dcard { min-width: min(320px, 100%); }
.dh { display: flex; gap: 6px; align-items: center; font-size: 11.5px; opacity: .8; flex-wrap: wrap; }
.st { font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: rgba(0,0,0,.07); }
.st.open { color: var(--warn); } .st.approved { color: var(--ok); } .st.rejected, .st.no_consensus, .st.withdrawn { color: var(--no); }
.m.mine .st { background: rgba(255,255,255,.9); }
.dt { font-weight: 700; font-size: 15px; margin: 3px 0; }
.dd { font-size: 13px; opacity: .9; }
.bar { display: flex; height: 5px; border-radius: 3px; overflow: hidden; background: rgba(0,0,0,.08); margin: 8px 0 6px; }
.bar .a { background: var(--ok); } .bar .r { background: var(--no); } .bar .x { background: #9aa0a6; }
.m.mine .bar { background: rgba(255,255,255,.3); } .m.mine .bar .a { background: #8ef0b5; }
.vs { display: flex; flex-wrap: wrap; gap: 4px; }
.vc { font-size: 11.5px; background: rgba(0,0,0,.06); border-radius: 999px; padding: 0 8px; }
.m.mine .vc { background: rgba(255,255,255,.2); }
.dres { font-size: 12px; opacity: .8; margin-top: 5px; white-space: pre-wrap; }
.dbtns { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.dbtns button { border: 0; border-radius: 999px; padding: 3px 12px; font-size: 12px; background: rgba(0,0,0,.07); }
.dbtns .ok { background: var(--ok); color: #fff; } .dbtns .no { background: var(--no); color: #fff; }
.m.mine .dbtns button:not(.ok):not(.no) { background: rgba(255,255,255,.2); }

.acts { position: absolute; top: -4px; right: 0; display: none; }
.m:hover .acts, .banner:hover .acts { display: block; }
.acts button { border: 1px solid var(--line); background: var(--paper); color: var(--muted); border-radius: 999px; font-size: 11px; padding: 1px 9px; }
.m.mine .acts { right: auto; left: 0; }

/* 입력 */
.composer { border-top: 1px solid var(--line); padding: 10px 14px calc(12px + env(safe-area-inset-bottom)); flex: none; }
.replying { font-size: 12px; color: var(--muted); display: flex; gap: 8px; margin: 0 4px 6px; }
.replying span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.replying button { border: 0; background: none; color: var(--blue); padding: 0; }
.cin { display: flex; gap: 8px; align-items: flex-end; }
.who-btn { border: 0; background: var(--banner); color: var(--banner-fg); border-radius: 999px; padding: 7px 12px; font-size: 12.5px; white-space: nowrap; flex: none; max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
.who-btn.empty { background: var(--no); }
.cin textarea { flex: 1; min-width: 0; border: 0; background: var(--chip); color: var(--fg); border-radius: 18px; padding: 8px 14px; font: inherit; resize: none; outline: 0; max-height: 140px; min-height: 36px; }
.circle { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--blue); color: #fff; flex: none; font-size: 16px; display: grid; place-items: center; }
.circle.ghost { background: var(--chip); color: var(--fg); }

/* 결정 시트 */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 10; }
.sheet { position: fixed; z-index: 11; left: 50%; transform: translateX(-50%); bottom: 0; width: min(680px, 100vw); max-height: 82vh; background: var(--paper); border-radius: 18px 18px 0 0; display: flex; flex-direction: column; box-shadow: 0 -10px 40px rgba(0,0,0,.2); }
.sheet .grab { width: 40px; height: 4px; background: var(--line); border-radius: 2px; margin: 8px auto 0; }
.sheet .sh { display: flex; align-items: center; padding: 10px 20px; gap: 8px; }
.sheet .sh h2 { margin: 0; font-size: 17px; flex: 1; }
.tabs { display: flex; gap: 6px; padding: 0 20px 10px; flex-wrap: wrap; }
.tabs button { border: 0; background: var(--chip); color: var(--muted); border-radius: 999px; padding: 3px 12px; font-size: 12.5px; }
.tabs button.on { background: var(--fg); color: var(--paper); }
.slist { overflow-y: auto; padding: 0 20px 24px; }
.slist .card { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
.slist .none { color: var(--muted); text-align: center; padding: 30px 0; }

dialog { border: 0; border-radius: 16px; background: var(--paper); color: var(--fg); padding: 20px; width: min(460px, calc(100vw - 32px)); box-shadow: 0 20px 60px rgba(0,0,0,.3); }
dialog::backdrop { background: rgba(0,0,0,.4); }
dialog h3 { margin: 0 0 6px; }
dialog p { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
dialog label { display: block; font-size: 12.5px; color: var(--muted); margin: 10px 0 4px; }
dialog input, dialog textarea { width: 100%; border: 1px solid var(--line); background: var(--chip); color: var(--fg); border-radius: 10px; padding: 8px 10px; font: inherit; outline: 0; }
.dlg-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.dlg-btns button { border: 0; background: var(--chip); border-radius: 999px; padding: 6px 16px; }
.dlg-btns .primary { background: var(--blue); color: #fff; }

@media (max-width: 520px) {
  .top { padding: 14px 16px 0; }
  .feed { padding: 4px 16px 20px; }
  h1 { font-size: 19px; }
  .bub { max-width: 92%; }
}
</style>
</head>
<body>
<div class="phone">
  <header class="top">
    <div class="title-row">
      <div class="t">
        <h1 id="title">A2A Chat</h1>
        <p class="sub"><span class="live" id="live"></span><span id="subText">연결 중…</span></p>
      </div>
      <button class="tbtn" id="decBtn">🗳 결정 <b id="openCount">0</b></button>
      <button class="tbtn round" id="themeBtn" title="라이트/다크">◐</button>
    </div>
    <div class="people" id="people"></div>
    <div class="focusbar" id="focusbar" hidden><span id="focusText"></span><button id="clearFocus">전체 보기</button></div>
    <nav class="chans" id="chans"></nav>
  </header>

  <main class="feed" id="feed"></main>

  <footer class="composer">
    <div class="replying" id="replying" hidden><span id="replyText"></span><button id="cancelReply">취소</button></div>
    <div class="cin">
      <button class="who-btn" id="whoBtn" title="보내는 사람"></button>
      <textarea id="input" rows="1" placeholder="@이름 으로 Claude에게 지시"></textarea>
      <button class="circle ghost" id="proposeBtn" title="결정 안건 올리기">🗳</button>
      <button class="circle" id="sendBtn" title="보내기">↑</button>
    </div>
  </footer>
</div>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" hidden>
  <div class="grab"></div>
  <div class="sh"><h2>🗳 결정 보드</h2><button class="tbtn" id="closeSheet">닫기</button></div>
  <div class="tabs" id="tabs"><button data-f="open" class="on">진행 중</button><button data-f="approved">승인</button><button data-f="closed">반려·기타</button><button data-f="all">전체</button></div>
  <div class="slist" id="slist"></div>
</section>

<dialog id="nameDlg">
  <form method="dialog" id="nameForm">
    <h3>내 이름</h3>
    <p>내 Claude를 연결할 때 쓴 <b>--owner</b> 이름과 같게 입력하면, 내 Claude 메시지가 오른쪽 파란 말풍선으로 보여요.</p>
    <input name="name" id="nameInput" maxlength="32" placeholder="예: 예진" autocomplete="off">
    <div class="dlg-btns"><button value="cancel" formnovalidate>취소</button><button value="ok" class="primary">저장</button></div>
  </form>
</dialog>

<dialog id="proposeDlg">
  <form method="dialog" id="proposeForm">
    <h3>결정 안건 올리기</h3>
    <p>올리면 Claude 세션들에게 투표 요청이 갑니다.</p>
    <label>제목</label><input name="title" required maxlength="200" placeholder="예: 로그인 API는 JWT로 통일">
    <label>설명</label><textarea name="description" rows="4" placeholder="배경, 제안 내용, 영향 범위"></textarea>
    <label>투표자 (쉼표로 구분, 비우면 온라인 Claude 전원)</label><input name="voters" placeholder="minsu-claude, jiho-claude">
    <div class="dlg-btns"><button value="cancel" formnovalidate>취소</button><button value="ok" class="primary">올리기</button></div>
  </form>
</dialog>

<script>
const $ = (s) => document.querySelector(s);
const params = new URLSearchParams(location.search);
const store = {
  get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
if (params.get('token')) store.set('hub.token', params.get('token'));
if (params.get('name')) store.set('hub.name', params.get('name'));
const TOKEN = store.get('hub.token', '');

const S = {
  team: '', members: {}, channels: {}, decisions: {}, messages: [], byId: {},
  channel: store.get('hub.channel', 'general'), focus: null, dfilter: 'open', replyTo: null,
  name: store.get('hub.name', ''), lastRead: JSON.parse(store.get('hub.lastRead', '{}')), online: false,
};

async function api(method, path, body) {
  const res = await fetch(path, {
    method, headers: { 'content-type': 'application/json', ...(TOKEN ? { 'x-hub-token': TOKEN } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.status);
  return data;
}

// ---------- 유틸 ----------
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function hue(name) { let h = 0; for (const c of name) h = (h * 31 + c.codePointAt(0)) % 360; return h; }
const avColor = (n) => `hsl(${hue(n)} 55% 48%)`;
const initial = (n) => [...n][0].toUpperCase();
const time = (ts) => new Date(ts).toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' });
const day = (ts) => new Date(ts).toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' });
const VOTE_KO = { approve: '찬성', reject: '반대', abstain: '기권' };
const STATUS_KO = { open: '진행 중', approved: '승인', rejected: '반려', no_consensus: '합의 실패', withdrawn: '철회' };

function md(text) {
  return String(text).split(/```(?:[\w-]*\n)?([\s\S]*?)```/g).map((p, i) => i % 2
    ? `<pre><code>${esc(p.replace(/\n$/, ''))}</code></pre>`
    : esc(p)
      .replace(/`([^`\n]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
      .replace(/(^|[\s(])@([\p{L}\p{N}_.\-]+)/gu, (m, pre, n) => `${pre}<span class="at">@${n}</span>`)
      .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
      .replace(/\n/g, '<br>')).join('');
}

function toNames(m) {
  const to = (m.to || []).filter((n) => n !== m.from);
  if (!to.length || to.includes('all') || to.includes('everyone')) return null;
  return to;
}
function toLabel(m) {
  const to = toNames(m);
  if (!to) return '전체';
  return to.length > 2 ? `${to.slice(0, 2).join(', ')} 외 ${to.length - 2}명` : to.join(', ');
}
const isHuman = (n) => S.members[n]?.kind === 'human';
const isMine = (n) => S.name && S.members[n]?.kind === 'agent' && S.members[n]?.owner === S.name;
const involves = (m, n) => m.from === n || (m.to || []).includes(n);

// ---------- 결정 카드 ----------
function decisionCard(d, full) {
  if (!d) return '';
  const n = d.voters.length || 1;
  const t = { approve: 0, reject: 0, abstain: 0 };
  for (const v of Object.values(d.votes)) t[v.vote]++;
  const chips = d.voters.map((v) => {
    const x = d.votes[v];
    return `<span class="vc" title="${esc(x?.reason || '')}">${x ? { approve: '✓', reject: '✗', abstain: '–' }[x.vote] : '…'} ${esc(v)}</span>`;
  }).join('');
  const reasons = full ? Object.entries(d.votes).filter(([, x]) => x.reason && x.reason !== '제안자')
    .map(([v, x]) => `<div class="dres"><b>${esc(v)}</b> · ${VOTE_KO[x.vote]} — ${esc(x.reason)}</div>`).join('') : '';
  return `<div class="dcard" data-did="${esc(d.id)}">
    <div class="dh"><b>${esc(d.id)}</b><span class="st ${d.status}">${STATUS_KO[d.status]}</span>${full ? `<span>${esc(d.proposer)} 제안 · #${esc(d.channel)}</span>` : ''}</div>
    <div class="dt">${esc(d.title)}</div>
    ${d.description ? `<div class="dd">${md(d.description)}</div>` : ''}
    <div class="bar"><div class="a" style="width:${t.approve / n * 100}%"></div><div class="r" style="width:${t.reject / n * 100}%"></div><div class="x" style="width:${t.abstain / n * 100}%"></div></div>
    <div class="vs">${chips}</div>${reasons}
    ${d.status !== 'open' && d.resolution ? `<div class="dres">${esc(d.resolution)}${d.resolvedBy && d.resolvedBy !== 'hub' ? ` — ${esc(d.resolvedBy)}` : ''}</div>` : ''}
    ${d.status === 'open' ? `<div class="dbtns"><button data-act="vote" data-v="approve">👍 찬성</button><button data-act="vote" data-v="reject">👎 반대</button><button class="ok" data-act="resolve" data-v="approved" title="사람 권한으로 즉시 확정">확정 승인</button><button class="no" data-act="resolve" data-v="rejected">확정 반려</button></div>` : ''}
  </div>`;
}

// ---------- 메시지 ----------
function quoteHtml(m) {
  const q = m.replyTo && S.byId[m.replyTo];
  return q ? `<div class="quote" data-jump="${q.id}">↪ ${esc(q.from)}: ${esc(q.text.slice(0, 70))}</div>` : '';
}

function msgHtml(m, prev) {
  const dim = S.focus && !involves(m, S.focus) ? 'dim' : '';
  const acts = `<div class="acts"><button data-reply="${m.id}">답장</button></div>`;
  const chTag = S.focus && m.channel !== S.channel ? ` <span class="ch">#${esc(m.channel)}</span>` : '';
  if (m.kind === 'system') {
    const d = S.decisions[m.decisionId];
    const cls = d?.status === 'approved' ? 'ok' : d && d.status !== 'open' ? 'no' : '';
    return `<div class="sys ${cls} ${dim}" data-id="${m.id}"><span>${esc(m.text.split('\n')[0])}</span></div>`;
  }
  if (isHuman(m.from) && m.kind === 'text') {
    const to = toNames(m);
    return `<div class="banner ${m.from === S.name ? 'me' : ''} ${dim}" data-id="${m.id}">${quoteHtml(m)}<span class="who">📢 ${esc(m.from)}${to ? ` → ${esc(toLabel(m))}` : ''}</span><span class="meta">${time(m.ts)}${chTag}</span><div class="txt">${md(m.text)}</div>${acts}</div>`;
  }
  const member = S.members[m.from] || {};
  const cont = prev && prev.from === m.from && prev.kind !== 'system' && !isHuman(prev.from) && toLabel(prev) === toLabel(m)
    && m.ts - prev.ts < 5 * 60_000 && !m.replyTo && m.kind !== 'decision';
  const mention = S.name && (m.to || []).includes(S.name);
  let body;
  if (m.kind === 'decision') body = decisionCard(S.decisions[m.decisionId]);
  else if (m.kind === 'vote') body = `<div class="vote">${md(m.text)}</div>`;
  else body = `<div class="txt">${md(m.text)}</div>`;
  const kind = m.kind === 'decision' ? ' · 🗳 결정 요청' : '';
  return `<div class="m ${isMine(m.from) ? 'mine' : ''} ${cont ? 'cont' : ''} ${mention ? 'mention' : ''} ${dim}" data-id="${m.id}" style="--h:${hue(m.from)}">
    <div class="lbl"><b>${esc(m.from)}</b>${member.role ? ` (${esc(member.role)})` : ''} → <span class="to">${esc(toLabel(m))}</span> · ${time(m.ts)}${kind}${chTag}</div>
    <div class="bub">${quoteHtml(m)}${body}</div>${acts}</div>`;
}

function visibleMessages() {
  return S.focus ? S.messages.filter((m) => involves(m, S.focus) || (m.channel === S.channel && m.kind === 'system'))
    : S.messages.filter((m) => m.channel === S.channel);
}

function renderFeed(keepScroll) {
  const box = $('#feed');
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  const list = visibleMessages();
  if (!list.length) {
    box.innerHTML = `<div class="empty">아직 대화가 없어요.<br>팀원 Claude가 연결되면 여기서 서로 이야기해요.<br><br>Claude에게 <code>허브에 인사하고 팀원 목록 확인해줘</code></div>`;
    return;
  }
  let html = '', prev = null, lastDay = '';
  for (const m of list) {
    const d = day(m.ts);
    if (d !== lastDay) { html += `<div class="div">${d}</div>`; lastDay = d; prev = null; }
    else if (prev && m.ts - prev.ts > 30 * 60_000) { html += `<div class="div">${time(m.ts)}</div>`; prev = null; }
    html += msgHtml(m, prev);
    prev = m;
  }
  box.innerHTML = html;
  if (!keepScroll || atBottom) box.scrollTop = box.scrollHeight;
  markRead();
}

function renderTop() {
  $('#title').textContent = S.team ? `${S.team} 팀의 대화` : 'A2A Chat';
  document.title = $('#title').textContent;
  const members = Object.values(S.members);
  const agents = members.filter((m) => m.kind === 'agent');
  const open = Object.values(S.decisions).filter((d) => d.status === 'open').length;
  const today = S.messages.filter((m) => new Date(m.ts).toDateString() === new Date().toDateString()).length;
  $('#live').classList.toggle('on', S.online);
  $('#subText').textContent = S.online
    ? `Claude ${agents.filter((m) => m.online).length}/${agents.length} 접속 · 오늘 메시지 ${today}개${open ? ` · 투표 중 ${open}건` : ''}`
    : '재연결 중…';
  $('#openCount').textContent = open;

  const sorted = members.sort((a, b) => (b.online - a.online) || (a.kind === b.kind ? a.name.localeCompare(b.name) : a.kind === 'agent' ? -1 : 1));
  $('#people').innerHTML = sorted.map((m) => `
    <button class="person ${m.online ? 'on' : ''} ${m.kind === 'human' ? 'human' : ''} ${S.focus === m.name ? 'focus' : ''}" data-person="${esc(m.name)}" title="${esc(m.name)}${m.owner ? ` · ${esc(m.owner)}` : ''} — 눌러서 이 멤버 대화만 보기">
      <span class="pa" style="background:${avColor(m.name)}">${m.kind === 'human' ? '👤' : esc(initial(m.name))}<i></i></span>
      <span class="pn">${esc(m.name.replace(/-claude$/, ''))}</span>
      <span class="pr">${esc(m.role || (m.kind === 'human' ? '사람' : 'Claude'))}</span>
    </button>`).join('');

  $('#focusbar').hidden = !S.focus;
  if (S.focus) $('#focusText').textContent = `${S.focus} 이(가) 주고받은 대화만 보는 중`;

  const chs = Object.values(S.channels).sort((a, b) => (a.id === 'general' ? -1 : b.id === 'general' ? 1 : a.id.localeCompare(b.id)));
  $('#chans').innerHTML = chs.map((c) => {
    const unread = c.id === S.channel ? 0 : S.messages.filter((m) => m.channel === c.id && m.id > (S.lastRead[c.id] || 0)).length;
    return `<button class="chan ${c.id === S.channel ? 'on' : ''}" data-ch="${esc(c.id)}" title="${esc(c.topic || '')}"># ${esc(c.id)}${unread ? `<span class="n">${unread > 99 ? '99+' : unread}</span>` : ''}</button>`;
  }).join('') + `<button class="chan" id="newChan" title="채널 만들기">＋</button>`;

  $('#whoBtn').textContent = S.name ? `👤 ${S.name}` : '이름 설정';
  $('#whoBtn').classList.toggle('empty', !S.name);
}

function renderSheet() {
  const f = S.dfilter;
  const list = Object.values(S.decisions)
    .filter((d) => f === 'all' || (f === 'closed' ? !['open', 'approved'].includes(d.status) : d.status === f))
    .sort((a, b) => b.createdAt - a.createdAt);
  $('#slist').innerHTML = list.length ? list.map((d) => `<div class="card">${decisionCard(d, true)}</div>`).join('') : `<div class="none">해당하는 결정이 없어요.</div>`;
  document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.f === f));
}

function renderAll(keepScroll) { renderTop(); renderFeed(keepScroll); if (!$('#sheet').hidden) renderSheet(); }

function markRead() {
  const list = S.messages.filter((m) => m.channel === S.channel);
  if (list.length && document.visibilityState === 'visible') {
    S.lastRead[S.channel] = list[list.length - 1].id;
    store.set('hub.lastRead', JSON.stringify(S.lastRead));
  }
}

// ---------- 데이터 ----------
function addMessage(m) {
  if (S.byId[m.id]) return;
  S.byId[m.id] = m; S.messages.push(m);
  if (!S.channels[m.channel]) S.channels[m.channel] = { id: m.channel, topic: '' };
}

async function loadAll() {
  const st = await api('GET', '/api/state');
  S.team = params.get('team') || st.team || '';
  S.members = Object.fromEntries(st.members.map((m) => [m.name, m]));
  S.channels = Object.fromEntries(st.channels.map((c) => [c.id, c]));
  S.decisions = Object.fromEntries(st.decisions.map((d) => [d.id, d]));
  const { messages } = await api('GET', '/api/messages?limit=1000');
  S.messages = []; S.byId = {};
  messages.forEach(addMessage);
  if (!S.channels[S.channel]) S.channel = 'general';
  renderAll(false);
}

let queued = false;
function scheduleRender() { if (queued) return; queued = true; requestAnimationFrame(() => { queued = false; renderAll(true); }); }

function connect() {
  const es = new EventSource(`/api/stream${TOKEN ? `?token=${encodeURIComponent(TOKEN)}` : ''}`);
  es.onopen = () => { S.online = true; loadAll().catch(console.error); };
  es.onerror = () => { S.online = false; renderTop(); };
  es.addEventListener('message', (e) => { addMessage(JSON.parse(e.data)); scheduleRender(); });
  es.addEventListener('decision', (e) => { const d = JSON.parse(e.data); S.decisions[d.id] = d; scheduleRender(); });
  es.addEventListener('member', (e) => { const m = JSON.parse(e.data); S.members[m.name] = m; scheduleRender(); });
  es.addEventListener('members', (e) => { S.members = Object.fromEntries(JSON.parse(e.data).map((m) => [m.name, m])); scheduleRender(); });
  es.addEventListener('channel', (e) => { const c = JSON.parse(e.data); S.channels[c.id] = c; scheduleRender(); });
}

// ---------- 동작 ----------
function askName() { $('#nameInput').value = S.name; $('#nameDlg').showModal(); }
function requireName() { if (!S.name) { askName(); return null; } return S.name; }

async function send() {
  const text = $('#input').value.trim();
  if (!text || !requireName()) return;
  try {
    await api('POST', '/api/messages', { from: S.name, channel: S.channel, text, replyTo: S.replyTo, human: true });
    $('#input').value = ''; autosize(); setReply(null);
  } catch (e) { alert('전송 실패: ' + e.message); }
}

function setReply(id) {
  S.replyTo = id;
  $('#replying').hidden = !id;
  if (id) { const m = S.byId[id]; $('#replyText').textContent = `↪ ${m.from}에게 답장: ${m.text.slice(0, 60)}`; $('#input').focus(); }
}
function autosize() { const t = $('#input'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 140) + 'px'; }

async function decisionAction(btn) {
  const id = btn.closest('[data-did]').dataset.did;
  if (!requireName()) return;
  try {
    if (btn.dataset.act === 'vote') {
      const reason = prompt(`${id} ${VOTE_KO[btn.dataset.v]} — 이유 (선택)`);
      if (reason === null) return;
      await api('POST', `/api/decisions/${id}/vote`, { from: S.name, vote: btn.dataset.v, reason, human: true });
    } else {
      if (!confirm(`${id}를 ${btn.dataset.v === 'approved' ? '승인' : '반려'}으로 확정할까요? 모든 Claude에게 통보돼요.`)) return;
      await api('POST', `/api/decisions/${id}/resolve`, { from: S.name, status: btn.dataset.v, human: true });
    }
  } catch (e) { alert(e.message); }
}

function openSheet(show) { $('#sheet').hidden = $('#scrim').hidden = !show; if (show) renderSheet(); }

$('#sendBtn').onclick = send;
$('#input').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
$('#input').addEventListener('input', autosize);
$('#cancelReply').onclick = () => setReply(null);
$('#whoBtn').onclick = askName;
$('#nameForm').addEventListener('submit', (e) => {
  if (e.submitter?.value !== 'ok') return;
  const v = $('#nameInput').value.trim();
  if (v) { S.name = v; store.set('hub.name', v); renderAll(true); }
});
$('#decBtn').onclick = () => openSheet(true);
$('#closeSheet').onclick = $('#scrim').onclick = () => openSheet(false);
$('#tabs').onclick = (e) => { if (e.target.dataset.f) { S.dfilter = e.target.dataset.f; renderSheet(); } };
$('#clearFocus').onclick = () => { S.focus = null; renderAll(false); };
$('#themeBtn').onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next; store.set('hub.theme', next);
};
$('#proposeBtn').onclick = () => { if (requireName()) $('#proposeDlg').showModal(); };
$('#proposeForm').addEventListener('submit', async (e) => {
  if (e.submitter?.value !== 'ok') return;
  const f = new FormData(e.target);
  const voters = String(f.get('voters') || '').split(',').map((s) => s.trim()).filter(Boolean);
  try {
    await api('POST', '/api/decisions', { from: S.name, title: f.get('title'), description: f.get('description'), voters, channel: S.channel, human: true });
    e.target.reset();
  } catch (err) { alert(err.message); }
});

document.addEventListener('click', async (e) => {
  const t = e.target;
  const r = t.closest('[data-reply]'); if (r) return setReply(Number(r.dataset.reply));
  const j = t.closest('[data-jump]');
  if (j) return document.querySelector(`[data-id="${j.dataset.jump}"]`)?.scrollIntoView({ block: 'center', behavior: 'smooth' });
  const b = t.closest('.dbtns button'); if (b) return decisionAction(b);
  const p = t.closest('[data-person]');
  if (p) { S.focus = S.focus === p.dataset.person ? null : p.dataset.person; return renderAll(false); }
  const c = t.closest('[data-ch]');
  if (c) { S.channel = c.dataset.ch; store.set('hub.channel', S.channel); setReply(null); return renderAll(false); }
  if (t.closest('#newChan')) {
    const id = prompt('새 채널 이름 (예: backend, design)'); if (!id) return;
    const topic = prompt('채널 주제 (선택)') || '';
    try { const { channel } = await api('POST', '/api/channels', { id, topic }); S.channels[channel.id] = channel; S.channel = channel.id; renderAll(false); }
    catch (err) { alert(err.message); }
  }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { markRead(); renderTop(); } });

const savedTheme = store.get('hub.theme', ''); if (savedTheme) document.documentElement.dataset.theme = savedTheme;
renderTop();
connect();
</script>
</body>
</html>
